name: CI

# 这个工具的部署平台是 Windows —— 实验室里双击「启动数据处理工具.bat」跑数据。
# 但开发和 PR 检查用 Linux 更便宜、更快，所以两边都测：
#
#   ubuntu   覆盖 requires-python 的版本区间（3.9 是下界）
#   windows  确保真正的使用环境没坏（控制台编码、路径分隔符、CRLF 都只在这里暴露）
#
# 刻意不测 macOS：没有人在这台工具上用 macOS，加一个平台只是多一份维护成本。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 无显示器环境里导入 matplotlib.pyplot 必须走 Agg。
  # 不设的话某些后端会在 import 时就去找显示服务，报一个和测试毫无关系的错。
  MPLBACKEND: Agg
  # 让输出立刻刷出来 —— 万一某一步被中途掐掉，日志里也能看到停在哪儿。
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"          # pyproject 里 requires-python 的下界
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"         # 实际使用平台
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装（含开发依赖）
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 静态检查（未定义名 / 未用导入）
        shell: bash
        run: python -m pyflakes druid/

      - name: 自检
        shell: bash
        run: python -m pytest -q

      # 这条不是重复：这个工具要在"只装了 numpy/pandas"的实验室机器上
      # 也能自己验证没坏，所以不依赖 pytest 的那条路必须一直通着。
      - name: 自检（不装 pytest 的那条路）
        shell: bash
        run: python tests/run_all.py

      - name: 两个命令行入口都能起来
        shell: bash
        run: |
          druid-reduce --help > /dev/null
          druid-gui    --help > /dev/null

  wheel:
    name: wheel 完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 构建 wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # 网页资源漏进 wheel 的话，源码目录里跑一切正常，pip 装完打开界面是 404。
      # 这种问题只有真的看一眼 wheel 里的文件清单才发现得了。
      - name: 看 wheel 里有没有该有的东西
        shell: bash
        run: python tests/check_wheel.py
