name: Deploy docs

# 文档站点：把 docs/ 整个目录作为静态站点发布。
# 里面的每份 HTML 都是单文件自包含（图表内嵌），所以**不需要任何构建步骤**，
# 也不需要 Jekyll —— 直接用 Pages 的 artifact 通道，artifact 喂给 Pages 时不经过 Jekyll。
on:
  push:
    branches: [main]
    paths:
      # 只在文档或本工作流本身变化时触发，改代码不必白跑一遍
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:          # 也允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write                # 部署到 Pages
  id-token: write             # deploy-pages 用 OIDC 校验来源，缺这个会失败

# 同一时刻只允许一个 Pages 部署。不取消进行中的那一次：
# 中途打断会留下半成品站点，不如让它跑完再覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署文档站点
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true —— 首次运行时自动把仓库的 Pages 打开并设为
      # "GitHub Actions" 来源，省掉去 Settings 里手动点一次。
      # 如果这一步失败（个别情况需要仓库管理员先启用），
      # 去 Settings → Pages → Build and deployment → Source 选 "GitHub Actions" 即可。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 直接把 docs/ 打包成 artifact。不做构建、不做压缩，
      # 因为文件本身已经是最终形态 —— 少一步就少一处会出错的地方。
      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
